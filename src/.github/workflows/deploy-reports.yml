name: Deploy Test Reports to GitHub Pages

on:
  workflow_run:
    workflows: ["Deploy to GitHub Pages & Run Live Selenium E2E Tests", "Android Mobile Appium E2E Automation & GitHub Pages Reporting", "SmartPriceAI — Scale E2E Suites (400+ Test Cases) with Selenium, Appium & Performance"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  publish-reports:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Build Latest Report Snapshots
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          pip install openpyxl
          python automation/runner.py
          python mobile_automation/mobile_runner.py

      - name: 🌐 Deploy Reports to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./reports
          destination_dir: reports
          keep_files: true
